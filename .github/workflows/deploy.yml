name: Deploy a gogodevs.cl

on:
  push:
    branches:
      - main
  # Boton "Run workflow" para reactivar el deploy sin un push nuevo. Solo publica main:
  # el job no corre si alguien lo lanza desde otra rama.
  workflow_dispatch:

# Un solo deploy por FTP a la vez: este y el del blog diario (blog-diario.yml)
# comparten el grupo para no pisarse si coinciden.
concurrency:
  group: deploy-ftp-gogodevs
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # el token de GitHub no queda en .git/config

      - name: Instalar lftp
        run: bash .github/scripts/instalar_lftp.sh

      - name: Deploy por FTPS (TLS obligatorio, servidor verificado; nunca FTP en claro)
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: bash .github/scripts/desplegar_ftp.sh
