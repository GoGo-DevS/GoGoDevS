name: Deploy a gogodevs.cl

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar lftp
        run: sudo apt-get install -y lftp

      - name: Deploy por FTP
        run: |
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_HOST }}" << 'EOF'
          set ftp:ssl-allow no
          set ftp:passive-mode on
          set net:max-retries 3
          set net:timeout 30
          mirror -R --delete --only-newer --exclude-glob .git* --exclude-glob .vscode/ --verbose . /domains/gogodevs.cl/public_html/
          bye
          EOF
