<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 84" role="img" aria-label="Popi Uniformes Clínicos">
  <!--
    LOGO PROVISIONAL — NO es la identidad final de Popi.
    Nicole tiene un logo real (se ve en su Instagram) que todavia no nos entrego, y
    no hay mockups aprobados por ella. Esto es un marcador con la paleta del sitio
    (verde clinico + menta + coral) para no mostrar el logo de otra marca ni un
    hueco roto. Reemplazar por el archivo real apenas lo mande.
  -->
  <defs>
    <linearGradient id="popiMarca" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F5A5E"/>
      <stop offset="1" stop-color="#2E8F8C"/>
    </linearGradient>
  </defs>
  <rect x="2" y="10" width="64" height="64" rx="19" fill="url(#popiMarca)"/>
  <circle cx="52" cy="25" r="6.5" fill="#F2857D"/>
  <path d="M14 45 h9.5 l6-13 8.5 25 6-12 h10.5" fill="none" stroke="#7FD1C8"
        stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="47" font-family="Outfit,'Segoe UI',Arial,sans-serif"
        font-size="35" font-weight="700" fill="#0F5A5E" letter-spacing="1.5">POPI</text>
  <text x="82" y="65" font-family="Outfit,'Segoe UI',Arial,sans-serif"
        font-size="10.5" font-weight="500" fill="#4A5568" letter-spacing="3">UNIFORMES CLÍNICOS</text>
</svg>
